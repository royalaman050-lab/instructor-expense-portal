
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Expense Portal</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  background-image:
    linear-gradient(rgba(8, 35, 60, 0.25), rgba(8, 35, 60, 0.25)),
    url("file_000000000fb4821186fc417f54ab9341.png");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
    }
    .container {
  max-width: 600px;
  margin: 25px auto;
  background: rgba(255, 255, 255, 0.18);
  padding: 30px;
  border-radius: 22px;
  box-shadow: 0 15px 45px rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
    }
    h1, h2 { text-align: center; }
    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }
    input, select, textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 13px 14px;
  margin-top: 7px;
  border: 1px solid #d6deea;
  border-radius: 10px;
  font-size: 15px;
  background: #f9fbff;
  transition: 0.2s ease;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #1769d2;
  background: white;
  box-shadow: 0 0 0 3px rgba(23, 105, 210, 0.10);
}

   button {
  width: 100%;
  padding: 13px;
  margin-top: 18px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #1769d2, #4388e8);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(23, 105, 210, 0.22);
  transition: 0.2s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(23, 105, 210, 0.28);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
    #portal { display: block; }
        .expense-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .expense-option {
      display: block;
      margin: 0;
      cursor: pointer;
    }

    .expense-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    .expense-option span {
      display: block;
      padding: 15px 8px;
      border: 1px solid #ccd3dc;
      border-radius: 8px;
      text-align: center;
      background: white;
      color: #222;
    }

    .expense-option input[type="radio"]:checked + span {
      border: 2px solid #16803c;
      background: #eaf8ee;
      font-weight: bold;
    }

    .expense-option input[type="radio"]:focus-visible + span {
      outline: 2px solid #1769d2;
    }
    .brand {
  text-align: center;
  margin: 5px auto 20px;
  background: transparent;
  padding: 0;
  border: none;
  box-shadow: none;
}

.brand img {
  width: 350px;
  max-width: 90%;
  height: auto;
  display: inline-block;
  background: transparent;
  border: none;
  box-shadow: none;
}
  </style>
</head>
<body>
<div class="brand">
    <img src="file_000000006eb08211abaa27cd97388cf2.png"
     alt="Sahshik Adventure Logo"
     class="logo">
</div>
  <div class="container" id="loginBox">
    <h1>Instructor Login</h1>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" required>

      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" required>

      <button type="submit" id="loginButton">Login</button>
      <p class="notice" id="loginNotice"></p>
    </form>
  </div>
<main class="container" id="portal">

  <h1>Instructor Expense Portal</h1>

  <button type="button" id="logoutButton">Logout</button>

  <form id="expenseForm">

    <label for="name">Full Name</label>
    <input id="name" type="text" placeholder="Enter full name" required>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Enter email" required>

    <label for="phone">Phone</label>
    <input id="phone" type="tel" placeholder="Enter phone number" required>

    <label for="date">Program Date</label>
    <input id="date" type="date" required>

    <label for="office">School Name</label>
    <input id="office" type="text" placeholder="Enter school name" required>

    <label>Type of Program</label>

    <div class="expense-options">

      <label class="expense-option">
        <input type="radio" name="program_type" value="Trip" required>
        <span>🏕️ Trip</span>
      </label>

      <label class="expense-option">
        <input type="radio" name="program_type" value="Day Camp">
        <span>⛺ Day Camp</span>
      </label>

    </div>

    <label for="location">Location</label>
    <input
      id="location"
      type="text"
      placeholder="Enter program location"
      required
    >

    <label>Expense</label>

    <div class="expense-options">

      <label class="expense-option">
        <input type="radio" name="head" value="Transport" required>
        <span>🚗 Transport</span>
      </label>

      <label class="expense-option">
        <input type="radio" name="head" value="Food">
        <span>🍱 Food</span>
      </label>

      <label class="expense-option">
        <input type="radio" name="head" value="Hotel">
        <span>🏨 Hotel</span>
      </label>

      <label class="expense-option">
        <input type="radio" name="head" value="Other">
        <span>📌 Other</span>
      </label>

    </div>

    <label for="brief">Brief</label>
<textarea
  id="brief"
  rows="4"
  placeholder="Enter brief description..."
  required
></textarea>

<label for="breakup">Break-up Amount & Description</label>
<textarea
  id="breakup"
  rows="5"
  placeholder="Enter break-up amount and details..."
  required
></textarea>

<label for="party">Company / Vendor Name</label>
<input
  id="party"
  type="text"
  placeholder="Enter company or vendor name"
  required
>

<label for="amount">Total Expenses (₹)</label>
<input
  id="amount"
  type="number"
  min="0.01"
  step="0.01"
  placeholder="Enter total expenses"
  required
>

<label for="payment">Your Payment</label>
<input
  id="payment"
  type="text"
  placeholder="Enter your payment details"
>

<label for="receiptAmount">Receipt Amount (₹)</label>
<input
  id="receiptAmount"
  type="number"
  min="0"
  step="0.01"
  placeholder="Enter receipt amount"
>

<label for="receipt">Receipt / Payment Proof</label>
<input
  id="receipt"
  type="file"
  accept="image/png,image/jpeg,image/jpg,application/pdf,.doc,.docx"
  required
>

    <label for="amount">Total Amount (₹)</label>
    <input
      id="amount"
      type="number"
      min="0.01"
      step="0.01"
      placeholder="Enter total amount"
      required
    >

    <label for="payment">Payment Details</label>
    <input
      id="payment"
      type="text"
      placeholder="Enter payment details"
    >

    <label for="receipt">Receipt / Payment Proof</label>
    <input
      id="receipt"
      type="file"
      accept="image/*,application/pdf"
      required
    >

    <button type="submit">Submit Expense</button>

    <p class="notice" id="submitNotice"></p>

  </form>

</main>

  <!-- Admin Dashboard -->
<section class="container" id="adminDashboard" style="display:none;">
  <h2>Admin Dashboard</h2>

  <button id="refreshExpenses">Refresh</button>
  <button id="adminLogout">Logout</button>

  <p id="adminNotice"></p>

  <div style="overflow-x:auto;">
    <table border="1" cellpadding="10" cellspacing="0" width="100%">
      <thead>
        <tr>
  <th>Instructor</th>
  <th>Email</th>
  <th>Phone</th>
  <th>Program Date</th>
  <th>School Name</th>
  <th>Program Type</th>
  <th>Location</th>
  <th>Expense</th>
  <th>Company / Vendor</th>
  <th>Total</th>
  <th>Brief</th>
<th>Break-up Amount & Description</th>
<th>Total Expenses</th>
<th>Your Payment</th>
<th>Receipt Amount</th>
<th>Receipt / Proof</th>
  <th>Status</th>
  <th>Receipt</th>
        </tr>
      </thead>

      <tbody id="expensesTableBody">
        <tr>
          <td colspan="12">No expenses loaded.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Supabase connection
    const SUPABASE_URL = "https://hkjoyeucabqnmtzpquxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_QIi5MBOnDpDxlRBdUqK63Q_t9kF-bYs";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
      const isAdminPage =
  new URLSearchParams(window.location.search).get("admin") === "1";

if (isAdminPage) {
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("portal").style.display = "none";
} else {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("portal").style.display = "block";
}
    // ===============================
// ADMIN DASHBOARD
// ===============================

const adminDashboard = document.getElementById("adminDashboard");
const expensesTableBody = document.getElementById("expensesTableBody");
const adminNotice = document.getElementById("adminNotice");
const refreshExpenses = document.getElementById("refreshExpenses");
const adminLogout = document.getElementById("adminLogout");

async function loadAdminExpenses() {
  adminNotice.textContent = "Loading expenses...";

  const { data, error } = await supabaseClient
    .from("expenses")
    .select("*")
    .order("journey_date", { ascending: false });

  if (error) {
    adminNotice.textContent = "Failed to load expenses: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    expensesTableBody.innerHTML = `
      <tr>
  <td colspan="14">No expenses submitted yet.</td>
</tr>
    `;
    adminNotice.textContent = "";
    return;
  }

  expensesTableBody.innerHTML = data.map(expense => `
  <tr>
    <td>${expense.full_name || ""}</td>
    <td>${expense.email || ""}</td>
    <td>${expense.phone || ""}</td>
    <td>${expense.program_date || ""}</td>
    <td>${expense.office_name || ""}</td>
    <td>${expense.program_type || ""}</td>
    <td>${expense.location || ""}</td>
    <td>${expense.expense_head || ""}</td>
    <td>${expense.party_name || ""}</td>
    <td>${expense.brief || ""}</td>
    <td>${expense.breakup || ""}</td>
    <td>₹${expense.amount || 0}</td>
    <td>${expense.payment_details || ""}</td>
    <td>₹${expense.receipt_amount || 0}</td>
    <td>${expense.status || ""}</td>
    <td>
      ${
        expense.receipt_path
          ? `<button onclick="viewReceipt('${expense.receipt_path}')">
              View Receipt
            </button>`
          : "No receipt"
      }
    </td>
  </tr>
`).join("");

  adminNotice.textContent = `${data.length} expense(s) found.`;
}
    // View Receipt
async function viewReceipt(receiptPath) {
  try {
    const { data, error } = await supabaseClient
      .storage
      .from("expense-receipts")
      .createSignedUrl(receiptPath, 300);

    if (error) throw error;

    if (!data || !data.signedUrl) {
      throw new Error("Could not create receipt link.");
    }

    window.open(data.signedUrl, "_blank");

  } catch (error) {
    alert("Receipt open nahi ho rahi: " + error.message);
  }
}

// Refresh button
refreshExpenses.addEventListener("click", loadAdminExpenses);

// Admin logout
adminLogout.addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  window.location.href = window.location.pathname;
});
    // Login
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const button = document.getElementById("loginButton");
      const notice = document.getElementById("loginNotice");

      button.disabled = true;
      notice.textContent = "Logging in...";

      try {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        const user = data.user;

        const { data: profile, error: profileError } = await supabaseClient
          .from("profiles")
          .select("role")
          .eq("id", user.id)
          .single();

        if (profileError) throw profileError;

        if (String(profile.role).toLowerCase() !== "admin") {
  await supabaseClient.auth.signOut();
  throw new Error("Admin access required.");
}

document.getElementById("loginBox").style.display = "none";

if (isAdminPage) {
  document.getElementById("portal").style.display = "none";
  document.getElementById("adminDashboard").style.display = "block";

  loadAdminExpenses();
} else {
  document.getElementById("portal").style.display = "block";
}

const emailField = document.getElementById("email");
        if (!emailField.value) emailField.value = user.email || "";

        notice.textContent = "";
      } catch (error) {
        notice.textContent = "Login failed: " + error.message;
      } finally {
        button.disabled = false;
      }
    });

    // Logout
    document.getElementById("logoutButton").addEventListener("click", async function() {
      const { error } = await supabaseClient.auth.signOut();

      if (error) {
        alert("Logout failed: " + error.message);
        return;
      }

      document.getElementById("portal").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
      loginForm.reset();
      document.getElementById("expenseForm").reset();
    });

    // Submit expense
    document.getElementById("expenseForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      const notice = document.getElementById("submitNotice");

      button.disabled = true;
      button.textContent = "Submitting...";
      notice.textContent = "Please wait...";

      let uploadedPath = null;

        try {
  const { data: sessionData, error: sessionError } =
    await supabaseClient.auth.getSession();

  if (sessionError) throw sessionError;

  let user = sessionData.session?.user;

  if (!user) {
    const { data, error } =
      await supabaseClient.auth.signInAnonymously();

    if (error) throw error;

    user = data.user;
  }

  const amount = Number(document.getElementById("amount").value);
  if (!Number.isFinite(amount) || amount <= 0) {
    throw new Error("Enter a valid amount.");
  }

        const file = document.getElementById("receipt").files[0];
        if (!file) throw new Error("Please select a receipt.");

        const allowedTypes = [
  "application/pdf",
  "image/png",
  "image/jpeg",
  "image/jpg",
  "application/msword",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
];

const allowedType = allowedTypes.includes(file.type);

        if (!allowedType) {
          throw new Error("Only PNG, JPG, PDF, DOC or DOCX proof files are allowed.");
        }

        if (file.size > 10 * 1024 * 1024) {
          throw new Error("Receipt must be 10 MB or smaller.");
        }

        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        uploadedPath = user.id + "/" + Date.now() + "_" + safeName;

        const { error: uploadError } = await supabaseClient
          .storage
          .from("expense-receipts")
          .upload(uploadedPath, file, {
            contentType: file.type,
            upsert: false
          });

        if (uploadError) throw uploadError;

  const expense = {
  employee_id: user.id,

  full_name: document.getElementById("name").value.trim(),

  email: document.getElementById("email").value.trim(),

  phone: document.getElementById("phone").value.trim(),

  program_date: document.getElementById("date").value,

  office_name: document.getElementById("office").value.trim(),

  program_type:
    document.querySelector('input[name="program_type"]:checked')?.value || "",

  location: document.getElementById("location").value.trim(),

  expense_head:
    document.querySelector('input[name="head"]:checked')?.value || "",

  brief: document.getElementById("brief").value.trim(),

  breakup_Ammount: document.getElementById("Ammount").value.trim(),

  party_name: document.getElementById("party").value.trim(),

  amount: amount,

  payment_details:
    document.getElementById("payment").value.trim(),

  receipt_amount:
    Number(document.getElementById("receiptAmount").value) || 0,

  receipt_path: uploadedPath,

  status: "pending",

  reviewed_by: null,

  reviewed_at: null
};

        const { error: insertError } = await supabaseClient
          .from("expenses")
          .insert(expense);

        if (insertError) throw insertError;

        notice.textContent = "Expense submitted successfully!";
        form.reset();

      } catch (error) {
        notice.textContent = "Submission failed: " + error.message;

        // Remove uploaded receipt if database insert failed.
        if (uploadedPath) {
          await supabaseClient
            .storage
            .from("expense-receipts")
            .remove([uploadedPath]);
        }
      } finally {
        button.disabled = false;
        button.textContent = "Submit Expense";
      }
    });
  </script>
</body>
</html>
